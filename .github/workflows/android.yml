name: Android CI

on:
  push:
    branches: [main, "agent/**", "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK, and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Prepare pinned whisper.cpp source
        run: bash scripts/prepare-whisper.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lyric-Video-Maker-offline-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
