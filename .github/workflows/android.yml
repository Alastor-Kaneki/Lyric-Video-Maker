name: Android CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final preview-state fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/alastorkaneki/lyricvideomaker/ui/LyricVideoMakerScreen.kt")
          source = path.read_text()
          old = '''    val previewBitmap by produceState<ImageBitmap?>(null, imageUri) {
              value = withContext(Dispatchers.IO) {
                  imageUri?.let { uri ->
                      val stream = if (uri.scheme == "file") FileInputStream(requireNotNull(uri.path))
                      else context.contentResolver.openInputStream(uri)
                      stream?.use { BitmapFactory.decodeStream(it)?.asImageBitmap() }
                  }
              }
          }
          '''
          new = '''    val previewBitmap by produceState<ImageBitmap?>(null, imageUri) {
              val selectedImage = imageUri
              val decoded = withContext(Dispatchers.IO) {
                  selectedImage?.let { uri ->
                      val stream = if (uri.scheme == "file") FileInputStream(requireNotNull(uri.path))
                      else context.contentResolver.openInputStream(uri)
                      stream?.use { BitmapFactory.decodeStream(it)?.asImageBitmap() }
                  }
              }
              value = decoded
          }
          '''
          if old in source:
              path.write_text(source.replace(old, new, 1))
          PY

          if ! git diff --quiet -- app/src/main/java/com/alastorkaneki/lyricvideomaker/ui/LyricVideoMakerScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/alastorkaneki/lyricvideomaker/ui/LyricVideoMakerScreen.kt
            git commit -m "Fix Compose preview state production"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lyric-Video-Maker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
