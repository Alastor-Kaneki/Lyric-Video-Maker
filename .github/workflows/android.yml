name: Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Normalize plain Compose source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/alastorkaneki/lyricvideomaker/ui/LyricVideoMakerScreen.kt')
          text = p.read_text()
          text = text.replace('import androidx.compose.foundation.layout.weight\n', '')
          text = text.replace(
              'import androidx.compose.material3.FilterChip\n',
              'import androidx.compose.material3.ExperimentalMaterial3Api\nimport androidx.compose.material3.FilterChip\n',
          )
          text = text.replace(
              '@Composable\nfun LyricVideoMakerScreen',
              '@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun LyricVideoMakerScreen',
          )
          p.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/alastorkaneki/lyricvideomaker/ui/LyricVideoMakerScreen.kt
            git commit -m "Fix Compose editor source"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Gradle test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: error
      - name: Stop after failed tests
        if: steps.unit_tests.outputs.status != '0'
        run: exit 1
      - name: Android lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lyric-Video-Maker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
