name: Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply complete app update
        if: ${{ hashFiles('project-update.part*') != '' }}
        shell: bash
        run: |
          cat project-update.part* > /tmp/project-update.tar.gz.b64
          base64 --decode /tmp/project-update.tar.gz.b64 > /tmp/project-update.tar.gz
          tar -xzf /tmp/project-update.tar.gz -C .
          rm -f project-update.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete lyric video creation pipeline"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle lintDebug --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lyric-Video-Maker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
